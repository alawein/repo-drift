[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-drift"
version = "0.1.0"
description = "Configurable repository drift checks with GitHub Actions annotations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8"]

[project.scripts]
repo-drift = "repo_drift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
include = ["repo_drift*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
