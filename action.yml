name: Repo Drift
description: Run repo-drift checks and surface findings as GitHub Actions annotations.
inputs:
  working-directory:
    description: Repository directory to check, relative to the workflow workspace.
    required: false
    default: .
  rules:
    description: Optional path to a rules file, relative to the workflow workspace.
    required: false
    default: ""
  detectors:
    description: Optional comma-separated list of detector names to run.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install repo-drift
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - name: Check repository drift
      shell: bash
      env:
        REPO_DRIFT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        REPO_DRIFT_RULES: ${{ inputs.rules }}
        REPO_DRIFT_DETECTORS: ${{ inputs.detectors }}
      run: |
        set -euo pipefail
        workspace="$(realpath -m "$GITHUB_WORKSPACE")"
        target="$(realpath -m "$workspace/$REPO_DRIFT_WORKING_DIRECTORY")"
        case "$target" in
          "$workspace"|"$workspace"/*) ;;
          *) echo "working-directory must remain inside GITHUB_WORKSPACE" >&2; exit 2 ;;
        esac
        args=(check --target "$target" --reporter github)
        if [ -n "$REPO_DRIFT_RULES" ]; then
          rules="$(realpath -m "$workspace/$REPO_DRIFT_RULES")"
          case "$rules" in
            "$workspace"|"$workspace"/*) ;;
            *) echo "rules must remain inside GITHUB_WORKSPACE" >&2; exit 2 ;;
          esac
          args+=(--rules "$rules")
        fi
        if [ -n "$REPO_DRIFT_DETECTORS" ]; then
          IFS=',' read -r -a detectors <<< "$REPO_DRIFT_DETECTORS"
          for detector in "${detectors[@]}"; do
            args+=(--detector "$detector")
          done
        fi
        repo-drift "${args[@]}"
